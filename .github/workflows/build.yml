name: Build - Godot-Client

on:
  push:
  pull_request:

# Bei mehreren Pushes hintereinander reicht der jeweils letzte Lauf.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Muss zur Godot-Version des Projekts passen (project.godot / Godot.NET.Sdk im csproj).
  GODOT_VERSION: 4.7.1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Godot herunterladen
        run: |
          NAME="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          curl -sSfL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/${NAME}.zip"
          unzip -q godot.zip
          # Die Binary wird gesucht, nicht aus dem Archivnamen zusammengesetzt: Der Ordner heisst
          # "..._linux_x86_64", die Datei darin schreibt Godot aber anders. Ein zusammengesetzter Name
          # ging ins Leere ("chmod: cannot access"). Suchen ueberlebt auch kuenftige Umbenennungen.
          GODOT_BIN="$(find . -maxdepth 3 -type f -name 'Godot_v*_mono_linux*' ! -name '*.zip' | head -1)"
          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Im Archiv wurde keine Godot-Binary gefunden. Inhalt:"
            unzip -l godot.zip
            exit 1
          fi
          chmod +x "$GODOT_BIN"
          echo "GODOT=$(realpath "$GODOT_BIN")" >> "$GITHUB_ENV"
          echo "Godot-Binary: $GODOT_BIN"

      # Legt .godot/ an und registriert die Szenen-UIDs. Muss vor dem Build laufen, weil der
      # Godot.NET.Sdk sich auf diese Struktur stützt.
      - name: Ressourcen importieren
        run: $GODOT --headless --path . --import

      # Scheitert unter anderem dann, wenn Conspiratio.Lib in der referenzierten Version nicht auf
      # nuget.org veröffentlicht ist – genau die Reproduzierbarkeit, die hier abgesichert werden soll.
      - name: Build
        run: dotnet build --configuration Debug

      # Instanziiert Main.tscn und führt alle _Ready()-Verdrahtungen aus. Godot beendet sich auch bei
      # Skriptfehlern mit Code 0, deshalb wird die Ausgabe zusätzlich auf Fehler geprüft.
      - name: Headless-Smoke-Test
        run: |
          set -o pipefail
          $GODOT --headless --path . --quit "res://scenes/Main.tscn" 2>&1 | tee smoke.log
          if grep -qE "SCRIPT ERROR|ERROR:|Failed to load|Cannot open" smoke.log; then
            echo "::error::Der Headless-Smoke-Test hat Fehler gemeldet (siehe Ausgabe oben)."
            exit 1
          fi

      # Spielt ein komplettes Spiel im Hot-Seat über mehrere Jahre: Zugbeginn, Rundgang durch die
      # Bereiche des Kontors, Zugende, Abrechnung, Wahlen, Jahresende-Ereignisse und zum Schluss eine
      # Speichern-/Laden-Probe. Der Treiber beendet sich mit Code 1, wenn der Ablauf hängt oder der
      # Spielzustand unplausibel wird – ein hängender Dialog fällt hier auf, nicht erst beim Spielen.
      # Zusätzlich wird die Ausgabe auf Skriptfehler geprüft, die Godot sonst mit Code 0 durchwinkt.
      - name: End-to-End-Durchlauf
        timeout-minutes: 15
        run: |
          set -o pipefail
          $GODOT --headless --path . "res://scenes/E2eTest.tscn" -- \
            --jahre=10 --spieler=2 --verbose 2>&1 | tee e2e.log
          if grep -qE "SCRIPT ERROR|Unhandled exception|Fehler beim" e2e.log; then
            echo "::error::Der End-to-End-Durchlauf hat Fehler gemeldet (siehe Ausgabe oben)."
            exit 1
          fi

      # Derselbe Durchlauf noch einmal, diesmal mit Bild: Von jeder Ansicht werden ein paar Zustände als
      # PNG abgelegt und als Artefakt hochgeladen – ein visuelles Protokoll jedes Pushes, in dem sich ein
      # verrutschtes Layout oder ein abgeschnittener Text erkennen lässt, den kein Test bemerkt.
      #
      # Warum nicht headless: Godots Headless-Modus hat einen Dummy-Rendertreiber, der nicht zeichnet.
      # Also läuft der Client hier vor einem virtuellen Bildschirm (Xvfb) und rendert über Mesa in
      # Software. Der OpenGL-Kompatibilitätsmodus ist dafür der einfachere Weg als Vulkan über lavapipe –
      # und er ist nachgemessen pixelgleich zum sonst genutzten Vulkan-Pfad, weil der Client reines 2D ist.
      #
      # Weniger Jahre als oben: Der eigentliche Ablauf ist im Schritt davor schon geprüft, hier geht es
      # nur um die Ansichten, und die sind je Ansicht ohnehin gedeckelt.
      - name: Visuelle Abnahme
        timeout-minutes: 15
        run: |
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libglu1-mesa
          xvfb-run -a --server-args="-screen 0 1600x900x24" \
            $GODOT --path . --rendering-method gl_compatibility --rendering-driver opengl3 \
            "res://scenes/E2eTest.tscn" -- \
            --jahre=4 --spieler=2 --bilder="$PWD/e2e-bilder" 2>&1 | tee bilder.log
          echo "Abgelegte Bilder: $(ls -1 e2e-bilder/*.png 2>/dev/null | wc -l)"
          if grep -qE "SCRIPT ERROR|Unhandled exception" bilder.log; then
            echo "::error::Die visuelle Abnahme hat Fehler gemeldet (siehe Ausgabe oben)."
            exit 1
          fi

      # Auch bei einem Fehlschlag hochladen – dann zeigen die Bilder gerade, woran es lag.
      - name: Screenshots als Artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansichten
          path: e2e-bilder/
          if-no-files-found: warn
          retention-days: 14
